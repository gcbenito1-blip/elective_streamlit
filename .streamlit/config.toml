[client]
showSidebarNavigation = false

[theme]
# Pastel Theme - Soft, Calming Color Palette
primaryColor = "#0089c9"           # Soft sky blue - gentle accent
backgroundColor = "#faf8f5"        # Warm off-white with subtle pink undertone
secondaryBackgroundColor = "#eef2f4"  # Light pastel blue-gray for cards/sections
textColor = "#4a5563"             # Soft charcoal - readable but not harsh
linkColor = "#0e5066"             # Muted teal - matches primary family
borderColor = "#dbe2e5"           # Light gray-blue for subtle borders
showWidgetBorder = true           # Clean widget definition
baseRadius = "0.8rem"             # Rounded corners - friendly feel
codeFont = "JetBrains Mono"       # Modern monospace for code blocks
codeBackgroundColor = "#e8eef1"   # Light blue-gray for code blocks

[theme.sidebar]
backgroundColor = "#eef2f4"        # Sidebar matches secondary
secondaryBackgroundColor = "#e2e8ec"
borderColor = "#d1dbe0"